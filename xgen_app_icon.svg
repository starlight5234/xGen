<svg width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="activeLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <title>xGen App Icon</title>
  <desc>Optically centered asymmetric app icon: vibrant indigo rounded square with an XPath tree highlighting a selected leaf node.</desc>

  <!-- High-contrast rounded squircle container -->
  <rect x="24" y="24" width="632" height="632" rx="140" fill="url(#bgGrad)" stroke="#818CF8" stroke-width="8"/>

  <!-- Inactive / Secondary branches (Optically balanced 134px horizontal margins) -->
  <line x1="305" y1="175" x2="170" y2="350" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="18" stroke-linecap="round"/>
  <line x1="440" y1="330" x2="510" y2="460" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="18" stroke-linecap="round"/>

  <!-- Inactive / Secondary nodes -->
  <circle cx="170" cy="350" r="36" fill="#FFFFFF" fill-opacity="0.75" filter="url(#glow)"/>
  <circle cx="510" cy="460" r="36" fill="#FFFFFF" fill-opacity="0.75" filter="url(#glow)"/>

  <!-- Primary Active XPath Path (Bold solid white lines with glow) -->
  <line x1="305" y1="175" x2="440" y2="330" stroke="url(#activeLineGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="440" y1="330" x2="360" y2="495" stroke="url(#activeLineGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Root Node (Counterweighted at 305, 175) -->
  <circle cx="305" cy="175" r="50" fill="#4338CA" stroke="#FFFFFF" stroke-width="18" filter="url(#glow)"/>

  <!-- Intermediate Active Node -->
  <circle cx="440" cy="330" r="44" fill="#4338CA" stroke="#FFFFFF" stroke-width="16" filter="url(#glow)"/>

  <!-- Target Leaf Node with verified XPath match (Enlarged, solid high-contrast white) -->
  <circle cx="360" cy="495" r="56" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Verified XPath checkmark -->
  <path d="M336 495 L354 514 L386 472" fill="none" stroke="#4338CA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>